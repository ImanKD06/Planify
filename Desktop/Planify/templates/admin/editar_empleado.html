{% extends "admin/layout.html" %}

{% block content %}

<div class="editar-empleado-card">

    <h2>Editar empleado</h2>

    <form method="POST">

        <div class="form-row">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" name="nombre" value="{{ empleado.nombre }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ empleado.email }}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Puesto</label>
                <input type="text" name="puesto" value="{{ empleado.puesto }}" required>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-update">Guardar cambios</button>
            <a href="{{ url_for('listar_empleados') }}" class="btn-cancel">Cancelar</a>
        </div>

    </form>

</div>

{% endblock %}
